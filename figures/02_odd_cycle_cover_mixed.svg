<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 940 480"><title>Odd cycle cover of a mixed graph</title><rect width="940" height="480" fill="#fff"/><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5d6d7e" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="470" y="34" fill="#1b2631" font-size="21" font-weight="bold" text-anchor="middle">The cover touches only the odd cycle</text><text x="470" y="58" fill="#5d6d7e" font-size="13" font-weight="normal" text-anchor="middle">Square n0-n3 (even) plus triangle n4-n6 (odd); the square is left untouched</text><line x1="150" x2="300" y1="150" y2="150" stroke="#95a5a6" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="2"/><line x1="300" x2="300" y1="150" y2="290" stroke="#95a5a6" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="2"/><line x1="300" x2="150" y1="290" y2="290" stroke="#95a5a6" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="2"/><line x1="150" x2="150" y1="290" y2="150" stroke="#95a5a6" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="2"/><line x1="660" x2="560" y1="140" y2="300" stroke="#c0392b" stroke-linecap="round" stroke-width="3"/><line x1="560" x2="760" y1="300" y2="300" stroke="#c0392b" stroke-linecap="round" stroke-width="3"/><line x1="760" x2="660" y1="300" y2="140" stroke="#c0392b" stroke-linecap="round" stroke-width="3"/><circle cx="150" cy="150" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="150" y="154.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n0</text><circle cx="300" cy="150" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="300" y="154.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n1</text><circle cx="300" cy="290" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="300" y="294.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n2</text><circle cx="150" cy="290" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="150" y="294.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n3</text><circle cx="660" cy="140" r="19" fill="#f5b7b1" stroke="#c0392b" stroke-width="3"/><text x="660" y="144.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n4</text><circle cx="560" cy="300" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="560" y="304.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n5</text><circle cx="760" cy="300" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="760" y="304.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n6</text><text x="225" y="355" fill="#5d6d7e" font-size="14" font-weight="bold" text-anchor="middle">even cycle</text><text x="225" y="376" fill="#98a6ad" font-size="12" font-weight="normal" text-anchor="middle">no vertex selected</text><text x="660" y="355" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">odd cycle</text><text x="660" y="376" fill="#98a6ad" font-size="12" font-weight="normal" text-anchor="middle">one vertex selected</text><rect width="700" height="50" x="120" y="405" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5" rx="8"/><text x="470" y="436" fill="#1b2631" font-size="15" font-weight="bold" text-anchor="middle">min_odd_cycle_cover -&gt; {n4}, cost = 1</text></svg>