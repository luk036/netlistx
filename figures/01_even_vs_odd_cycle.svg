<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 940 430"><title>Even vs. odd cycle and the odd cycle cover</title><rect width="940" height="430" fill="#fff"/><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5d6d7e" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="470" y="34" fill="#1b2631" font-size="21" font-weight="bold" text-anchor="middle">Even cycles need nothing, odd cycles need one vertex</text><text x="470" y="58" fill="#5d6d7e" font-size="13" font-weight="normal" text-anchor="middle">C is an odd cycle cover iff G[V \ C] has no odd cycle, i.e. is bipartite</text><rect width="420" height="320" x="30" y="80" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5" rx="10"/><text x="48" y="110" fill="#1b2631" font-size="15" font-weight="bold" text-anchor="start">(a) Even cycle C4 - bipartite</text><line x1="140" x2="310" y1="180" y2="180" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><line x1="310" x2="310" y1="180" y2="320" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><line x1="310" x2="140" y1="320" y2="320" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><line x1="140" x2="140" y1="320" y2="180" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><circle cx="140" cy="180" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="140" y="184.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n0</text><circle cx="310" cy="180" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="310" y="184.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n1</text><circle cx="310" cy="320" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="310" y="324.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n2</text><circle cx="140" cy="320" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="140" y="324.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n3</text><text x="225" y="372" fill="#5d6d7e" font-size="13" font-weight="normal" text-anchor="middle">2-colourable, so no odd cycle exists</text><text x="225" y="393" fill="#1e8449" font-size="14" font-weight="bold" text-anchor="middle">cover = {} cost = 0</text><rect width="420" height="320" x="490" y="80" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5" rx="10"/><text x="508" y="110" fill="#1b2631" font-size="15" font-weight="bold" text-anchor="start">(b) Odd cycle C3 - non-bipartite</text><line x1="700" x2="605" y1="175" y2="315" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><line x1="605" x2="795" y1="315" y2="315" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><line x1="795" x2="700" y1="315" y2="175" stroke="#95a5a6" stroke-linecap="round" stroke-width="2.5"/><circle cx="700" cy="175" r="19" fill="#f5b7b1" stroke="#c0392b" stroke-width="3"/><text x="700" y="179.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n4</text><circle cx="605" cy="315" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="605" y="319.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n5</text><circle cx="795" cy="315" r="19" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="795" y="319.7" fill="#1b2631" font-size="13" font-weight="bold" text-anchor="middle">n6</text><text x="700" y="372" fill="#5d6d7e" font-size="13" font-weight="normal" text-anchor="middle">one vertex breaks the only odd cycle</text><text x="700" y="393" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">cover = {n4} cost = 1</text></svg>