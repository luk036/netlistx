<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 960 470"><title>Primal-dual violation oracle: before and after</title><rect width="960" height="470" fill="#fff"/><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5d6d7e" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="480" y="34" fill="#1b2631" font-size="21" font-weight="bold" text-anchor="middle">The violation oracle dominated the runtime</text><text x="480" y="58" fill="#5d6d7e" font-size="13" font-weight="normal" text-anchor="middle">pd_cover calls the oracle about 2x|cover| times, and the old oracle restarted a full search each call</text><rect width="430" height="360" x="30" y="80" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5" rx="10"/><text x="48" y="110" fill="#1b2631" font-size="15" font-weight="bold" text-anchor="start">BEFORE - super-linear per call</text><line x1="99.6" x2="196.4" y1="151.3" y2="151.3" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="196.4" x2="196.4" y1="151.3" y2="238.7" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="196.4" x2="99.6" y1="238.7" y2="238.7" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="99.6" x2="99.6" y1="238.7" y2="151.3" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="99.6" x2="196.4" y1="151.3" y2="238.7" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><circle cx="99.6" cy="151.3" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><circle cx="196.4" cy="151.3" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><circle cx="196.4" cy="238.7" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><circle cx="99.6" cy="238.7" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><circle cx="148" cy="195" r="10.14" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/><text x="340" y="160" fill="#5d6d7e" font-size="12" font-weight="normal" text-anchor="middle">5 BFS passes</text><rect width="24" height="24" x="288" y="175" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4" rx="5"/><text x="300" y="192" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">1</text><rect width="24" height="24" x="318" y="175" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4" rx="5"/><text x="330" y="192" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">2</text><rect width="24" height="24" x="348" y="175" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4" rx="5"/><text x="360" y="192" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">3</text><rect width="24" height="24" x="378" y="175" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4" rx="5"/><text x="390" y="192" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">4</text><rect width="24" height="24" x="408" y="175" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.4" rx="5"/><text x="420" y="192" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">5</text><text x="245" y="266" fill="#5d6d7e" font-size="12.5" font-weight="normal" text-anchor="middle">BFS restarted from every source,</text><text x="245" y="288" fill="#5d6d7e" font-size="12.5" font-weight="normal" text-anchor="middle">topology recomputed on every call</text><rect width="390" height="113" x="50" y="312" fill="#fdf2f1" stroke="#e6b0aa" stroke-width="1.5" rx="8"/><text x="245" y="340" fill="#c0392b" font-size="16" font-weight="bold" text-anchor="middle">cost per call: O(V x (V + E))</text><text x="245" y="366" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">Python: BCC + chain decomposition, BFS per source</text><text x="245" y="386" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">C++: materialises every cycle, copying BFS info</text><text x="245" y="406" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">Rust: O(V) node-name scan per dequeued node</text><rect width="430" height="360" x="500" y="80" fill="#fbfcfd" stroke="#d5dbdf" stroke-width="1.5" rx="10"/><text x="518" y="110" fill="#1b2631" font-size="15" font-weight="bold" text-anchor="start">AFTER - single linear pass</text><line x1="569.2" x2="670.8" y1="159.1" y2="159.1" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="670.8" x2="670.8" y1="159.1" y2="250.9" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="670.8" x2="569.2" y1="250.9" y2="250.9" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="569.2" x2="569.2" y1="250.9" y2="159.1" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><line x1="569.2" x2="670.8" y1="159.1" y2="250.9" stroke="#95a5a6" stroke-linecap="round" stroke-width="2"/><circle cx="569.2" cy="159.1" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2"/><circle cx="670.8" cy="159.1" r="10.66" fill="#f9e79f" stroke="#b7950b" stroke-width="2"/><circle cx="670.8" cy="250.9" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2"/><circle cx="569.2" cy="250.9" r="10.66" fill="#f9e79f" stroke="#b7950b" stroke-width="2"/><circle cx="620" cy="205" r="10.66" fill="#aed6f1" stroke="#1f618d" stroke-width="2"/><line x1="700" x2="750" y1="205" y2="205" stroke="#5d6d7e" stroke-linecap="round" stroke-width="2" marker-end="url(#arrow)"/><text x="758" y="195" fill="#5d6d7e" font-size="12" font-weight="normal" text-anchor="start">first same-colour</text><text x="758" y="213" fill="#5d6d7e" font-size="12" font-weight="normal" text-anchor="start">edge = odd cycle</text><rect width="390" height="122" x="520" y="300" fill="#f0f9f3" stroke="#a9dfbf" stroke-width="1.5" rx="8"/><text x="715" y="328" fill="#1e8449" font-size="16" font-weight="bold" text-anchor="middle">cost per call: O(V + E)</text><text x="715" y="354" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">one BFS 2-colouring; a same-colour edge closes an odd cycle</text><text x="715" y="374" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">all three ports return the first odd cycle directly</text><text x="715" y="394" fill="#5d6d7e" font-size="11.5" font-weight="normal" text-anchor="middle">same cover size and cost, unchanged semantics</text></svg>